org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# URL base de la API (BuildConfig.API_BASE_URL). Se pueden sobrescribir con -P o en ~/.gradle/gradle.properties.
# Emulador: 10.0.2.2 es el host. Dispositivo físico: `adb reverse tcp:8080 tcp:8080` y http://localhost:8080/api/v1/
clinicaSerena.debugApiBaseUrl=http://10.0.2.2:8080/api/v1/
# Sin host de producción definido todavía: dominio .invalid para que un release nunca apunte a un servidor real por accidente.
clinicaSerena.releaseApiBaseUrl=https://api.clinica-serena.invalid/api/v1/
